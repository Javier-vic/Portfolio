<section class="experience" id="experience">
  <h2 class="experience__heading">{{ 'experience.heading' | translate }}</h2>

  @for (item of experiences; track item.id; let i = $index) {
    <div class="experience__block" [class.experience__block--reverse]="i % 2 !== 0">
      <div class="experience__image">
        <img [src]="item.image" alt="">
      </div>

      <div class="experience__content">
        <h3 class="experience__role">{{ item.id + '.role' | translate }}</h3>
        <p class="experience__company">{{ item.id + '.company' | translate }}</p>
        <p class="experience__description">{{ item.id + '.description' | translate }}</p>
      </div>
    </div>
  }
</section>
